<html lang="en">
<head>
  <title>TabAddict</title>
  <link rel="stylesheet" type="text/css" href="launch.css" />
  <link href='https://fonts.googleapis.com/css?family=Racing+Sans+One' rel='stylesheet' type='text/css'>
</head>
<body>

<div id="button-bar">
  <div id="title">TabAddict</div>
  <div class="wrapper-outer"><div class="wrapper-inner">
    <ul id="buttons">
      <li id="open" title="Open a session from file"><img src="icon_open.svg" alt="Open"></li>
      <li id="capture" title="Capture the current session"><img src="icon_capture.svg" alt="Capture"></li>
      <li id="launch" title="Launch the session being edited"><img src="icon_launch.svg" alt="Launch"></li>
    </ul>
  </div></div>
</div>

<textarea id="text" cols=40 rows=20 wrap="off"></textarea>

<script src="launch.js"></script>
</body>
</html>
